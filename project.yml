name: OpenGuard
options:
    bundleIdPrefix: com.jonasreidel
    deploymentTarget:
        iOS: "17.0"
    xcodeVersion: "16.0"
    groupSortPosition: top
    generateEmptyDirectories: true

settings:
    base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: 1 # iPhone only
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: 296KUW3HXV

targets:
    # ─────────────────────────────────────────────
    # Main App Target
    # ─────────────────────────────────────────────
    OpenGuard:
        type: application
        platform: iOS
        sources:
            - path: OpenGuard
              excludes:
                  - "**/.DS_Store"
            - path: Shared
              excludes:
                  - "**/.DS_Store"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.jonasreidel.openguard
                INFOPLIST_FILE: OpenGuard/Info.plist
                CODE_SIGN_ENTITLEMENTS: OpenGuard/OpenGuard.entitlements
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
                INFOPLIST_KEY_UIRequiresFullScreen: true
        entitlements:
            path: OpenGuard/OpenGuard.entitlements
            properties:
                com.apple.developer.family-controls: true
                com.apple.security.application-groups:
                    - group.com.jonasreidel.openguard
        dependencies:
            - target: ShieldConfigurationExtension
            - target: ShieldActionExtension
            - target: DeviceActivityMonitorExtension
        postCompileScripts: []

    # ─────────────────────────────────────────────
    # Shield Configuration Extension
    # ─────────────────────────────────────────────
    ShieldConfigurationExtension:
        type: app-extension
        platform: iOS
        sources:
            - path: ShieldConfigurationExtension
              excludes:
                  - "**/.DS_Store"
            - path: Shared
              excludes:
                  - "**/.DS_Store"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.jonasreidel.openguard.ShieldConfiguration
                INFOPLIST_FILE: ShieldConfigurationExtension/Info.plist
                CODE_SIGN_ENTITLEMENTS: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
                SKIP_INSTALL: true
        entitlements:
            path: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
            properties:
                com.apple.developer.family-controls: true
                com.apple.security.application-groups:
                    - group.com.jonasreidel.openguard

    # ─────────────────────────────────────────────
    # Shield Action Extension
    # ─────────────────────────────────────────────
    ShieldActionExtension:
        type: app-extension
        platform: iOS
        sources:
            - path: ShieldActionExtension
              excludes:
                  - "**/.DS_Store"
            - path: Shared
              excludes:
                  - "**/.DS_Store"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.jonasreidel.openguard.ShieldAction
                INFOPLIST_FILE: ShieldActionExtension/Info.plist
                CODE_SIGN_ENTITLEMENTS: ShieldActionExtension/ShieldActionExtension.entitlements
                SKIP_INSTALL: true
        entitlements:
            path: ShieldActionExtension/ShieldActionExtension.entitlements
            properties:
                com.apple.developer.family-controls: true
                com.apple.security.application-groups:
                    - group.com.jonasreidel.openguard

    # ─────────────────────────────────────────────
    # Device Activity Monitor Extension
    # ─────────────────────────────────────────────
    DeviceActivityMonitorExtension:
        type: app-extension
        platform: iOS
        sources:
            - path: DeviceActivityMonitorExtension
              excludes:
                  - "**/.DS_Store"
            - path: Shared
              excludes:
                  - "**/.DS_Store"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.jonasreidel.openguard.DeviceActivityMonitor
                INFOPLIST_FILE: DeviceActivityMonitorExtension/Info.plist
                CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
                SKIP_INSTALL: true
        entitlements:
            path: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
            properties:
                com.apple.developer.family-controls: true
                com.apple.security.application-groups:
                    - group.com.jonasreidel.openguard
